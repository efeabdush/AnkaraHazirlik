services:
  backend:
    build: ./backend
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - .env
    volumes:
      - ./backend/storage:/app/storage
      - ./content:/content
    environment:
      DATABASE_URL: sqlite:///./storage/hazirlik.db
      CORS_ORIGINS: http://localhost:3000
      CONTENT_DIR: /content

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    depends_on:
      - backend
